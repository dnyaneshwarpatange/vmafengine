# /etc/nginx/sites-available/vmaf-api
#
# Reverse proxy for the VMAF Video Optimization API.
# After placing this file, run:
#   sudo ln -s /etc/nginx/sites-available/vmaf-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;

    # Max upload / request body — adjust if you ever accept direct uploads
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generous enough for webhook processing
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
