# Production compose file — Worker server only.
# Run on the worker box: docker compose -f docker-compose.prod-worker.yml up -d --build
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    restart: unless-stopped
    # Limit temp file usage — /tmp inside the container
    tmpfs:
      - /tmp:size=20G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
